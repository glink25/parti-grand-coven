<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Grand Coven</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="game-shell" aria-live="polite">
    <header class="topbar">
      <div class="brand"><span class="sigil">✦</span><div><b>Grand Coven</b><small id="phaseLabel">Gathering</small></div></div>
      <div class="top-actions">
        <button id="langBtn" class="round-btn lang-btn" aria-label="Switch language">中</button>
        <button id="rulesBtn" class="round-btn" aria-label="How to play">?</button>
      </div>
    </header>
    <main class="table">
      <section id="players" class="players"></section>
      <section class="center-stage">
        <div id="roundBadge" class="round-badge">Round 0 / 5</div>
        <div id="roleStage" class="role-stage"></div>
        <div id="rituals" class="rituals"></div>
        <div id="message" class="message">Waiting for players</div>
      </section>
    </main>
    <section class="hand-zone">
      <div id="privateHint" class="private-hint">Your hidden role hand will appear here.</div>
      <div id="hand" class="hand"></div>
      <div id="controls" class="controls"></div>
    </section>
  </div>
  <dialog id="rulesDialog"><article><button id="closeRules" class="close">×</button><div id="rulesContent"></div></article></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="./client.js"></script>
</body>
</html>
